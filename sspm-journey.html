<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Attack Surface, Then & Now — Why SSPM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

  :root {
    --bg-dark: #000000;
    --bg-card: #131929;
    --bg-elev: #1a2235;
    --accent-blue: #307FE2;
    --accent-cyan: #3CB17E;
    --accent-orange: #FFB900;
    --accent-red: #DA291C;
    --accent-purple: #9063CD;
    --accent-teal: #2CCCD3;
    --accent-silver: #A2B2C8;
    --accent-grey: #75787B;
    --text-primary: #f5f5f7;
    --text-secondary: #86868b;
    --text-dim: #48484a;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.16);
    --glow-blue: rgba(48, 127, 226, 0.15);
    --glow-cyan: rgba(60, 177, 126, 0.15);
    --glow-orange: rgba(255, 185, 0, 0.15);
    --glow-red: rgba(218, 41, 28, 0.15);
    --glow-purple: rgba(144, 99, 205, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-dark);
    color: var(--text-primary);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* === Top bar === */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 76px; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-brand { display: flex; flex-direction: column; }
  .topbar-title {
    font-size: 12px; font-weight: 800; letter-spacing: 1.5px;
    text-transform: uppercase; color: #f0f4f8;
  }
  .topbar-subtitle { font-size: 11px; color: var(--text-dim); letter-spacing: 0.3px; margin-top: 1px; }

  .timeline { display: flex; align-items: center; gap: 6px; }
  .timeline-dot {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.12); background: transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: var(--text-dim);
    cursor: pointer; transition: all 0.25s;
    position: relative;
  }
  .timeline-dot::after {
    content: attr(title);
    position: absolute; top: 38px; left: 50%; transform: translateX(-50%);
    font-size: 9px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-dim);
    white-space: nowrap; pointer-events: none;
    transition: color 0.25s;
  }
  .timeline-dot.active::after { color: inherit; }
  .timeline-dot:hover:not(.active) { border-color: rgba(255,255,255,0.25); color: var(--text-secondary); }
  .timeline-dot.active { color: #fff; }
  .timeline-dot.era-old.active { border-color: var(--accent-blue); color: var(--accent-blue); box-shadow: 0 0 12px rgba(48,127,226,0.4); }
  .timeline-dot.era-new.active { border-color: var(--accent-orange); color: var(--accent-orange); box-shadow: 0 0 12px rgba(255,185,0,0.4); }
  .timeline-dot.era-gap.active { border-color: var(--accent-red); color: var(--accent-red); box-shadow: 0 0 12px rgba(218,41,28,0.4); }
  .timeline-dot.era-fix.active { border-color: var(--accent-cyan); color: var(--accent-cyan); box-shadow: 0 0 12px rgba(60,177,126,0.4); }
  .timeline-line { width: 40px; height: 2px; background: rgba(255,255,255,0.10); }
  .timeline-line.era-old.filled { background: var(--accent-blue); }
  .timeline-line.era-new.filled { background: var(--accent-orange); }
  .timeline-line.era-gap.filled { background: var(--accent-red); }
  .timeline-line.era-fix.filled { background: var(--accent-cyan); }

  .topbar-meta { font-size: 11px; color: var(--text-dim); font-family: 'Inter', monospace; letter-spacing: 0.04em; }

  /* === Stage / canvas === */
  .stage {
    position: fixed; inset: 0;
    padding-top: 76px;
    display: flex; flex-direction: column;
  }
  .canvas {
    flex: 1 1 0; min-height: 0;
    position: relative; overflow: hidden;
  }

  /* Scenes are absolutely positioned and fade between */
  .panel {
    position: absolute; inset: 0;
    padding: 32px clamp(28px, 6vw, 80px);
    display: flex; flex-direction: column;
    gap: 18px;
    opacity: 0; pointer-events: none;
    transform: translateY(8px);
    transition: opacity 0.45s ease, transform 0.45s ease;
  }
  .panel.show { opacity: 1; pointer-events: auto; transform: translateY(0); }

  .panel-head { text-align: center; max-width: 900px; margin: 0 auto; flex-shrink: 0; }
  .panel-head h1 {
    font-size: clamp(22px, 3vw, 34px); font-weight: 800; letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    line-height: 1.15;
  }
  .panel-head .tag {
    display: inline-block; vertical-align: middle;
    font-size: 10px; font-weight: 800; letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 4px 10px; border-radius: 4px;
    margin-right: 12px; transform: translateY(-3px);
  }
  .tag.era-old { background: rgba(48,127,226,0.12); color: var(--accent-blue); border: 1px solid rgba(48,127,226,0.35); }
  .tag.era-new { background: rgba(255,185,0,0.12); color: var(--accent-orange); border: 1px solid rgba(255,185,0,0.35); }
  .tag.era-gap { background: rgba(218,41,28,0.12); color: var(--accent-red); border: 1px solid rgba(218,41,28,0.35); }
  .tag.era-fix { background: rgba(60,177,126,0.12); color: var(--accent-cyan); border: 1px solid rgba(60,177,126,0.35); }

  .subtitle {
    color: var(--text-secondary); font-size: clamp(12px, 1.3vw, 14px);
    margin-top: 10px; max-width: 760px; margin-left: auto; margin-right: auto;
    line-height: 1.6;
  }

  .eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--accent-purple);
    margin-bottom: 8px;
  }

  .body {
    flex: 1 1 0; min-height: 0;
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    gap: 24px;
    align-items: stretch;
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
  }
  .body.single { grid-template-columns: 1fr; max-width: 1200px; }

  .visual {
    position: relative;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0));
    overflow: hidden;
    min-height: 0;
  }
  .side {
    display: flex; flex-direction: column; gap: 14px;
    min-height: 0; overflow-y: auto;
  }

  .card {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg-card);
    padding: 18px 20px;
  }
  .card h3 {
    margin: 0 0 8px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text-secondary);
  }
  .card p { margin: 0; font-size: 13px; line-height: 1.65; color: var(--text-primary); }
  .card.danger { border-color: rgba(218,41,28,0.35); background: linear-gradient(180deg, rgba(218,41,28,0.05), var(--bg-card)); }
  .card.danger h3 { color: var(--accent-red); }
  .card.warn { border-color: rgba(255,185,0,0.35); background: linear-gradient(180deg, rgba(255,185,0,0.04), var(--bg-card)); }
  .card.warn h3 { color: var(--accent-orange); }
  .card.good { border-color: rgba(60,177,126,0.35); background: linear-gradient(180deg, rgba(60,177,126,0.04), var(--bg-card)); }
  .card.good h3 { color: var(--accent-cyan); }
  .card.accent { border-color: rgba(48,127,226,0.35); background: linear-gradient(180deg, rgba(48,127,226,0.04), var(--bg-card)); }
  .card.accent h3 { color: var(--accent-blue); }

  .stat { display: flex; align-items: baseline; gap: 10px; }
  .stat .v { font-size: 26px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.01em; }
  .stat .l { font-size: 12px; color: var(--text-secondary); }

  ul.bullets { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  ul.bullets li {
    position: relative; padding-left: 22px;
    font-size: 13px; line-height: 1.55; color: var(--text-primary);
  }
  ul.bullets li::before {
    content: ""; position: absolute; left: 4px; top: 6px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent-blue); box-shadow: 0 0 8px rgba(48,127,226,0.6);
  }
  ul.bullets li.warn::before { background: var(--accent-orange); box-shadow: 0 0 8px rgba(255,185,0,0.6); }
  ul.bullets li.danger::before { background: var(--accent-red); box-shadow: 0 0 8px rgba(218,41,28,0.6); }
  ul.bullets li.good::before { background: var(--accent-cyan); box-shadow: 0 0 8px rgba(60,177,126,0.6); }

  /* === Footer controls === */
  .controls {
    display: flex; align-items: center; justify-content: center;
    gap: 12px;
    padding: 14px 32px 20px;
    flex-shrink: 0;
  }
  .nav-btn {
    padding: 10px 22px; border-radius: 22px;
    font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.25s; border: none;
  }
  .nav-btn:not(.primary) {
    background: rgba(255,255,255,0.06); color: var(--text-secondary);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .nav-btn:not(.primary):hover:not(:disabled) { background: rgba(255,255,255,0.1); color: var(--text-primary); }
  .nav-btn.primary {
    color: #fff;
    background: linear-gradient(135deg, var(--accent-red), var(--accent-blue));
    box-shadow: 0 4px 20px rgba(218,41,28,0.2);
  }
  .nav-btn.primary:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 28px rgba(218,41,28,0.3);
  }
  .nav-btn:disabled { opacity: 0.3; cursor: default; pointer-events: none; }
  .kbd-hint { font-size: 11px; color: var(--text-dim); margin-left: 12px; }
  .kbd {
    display: inline-block; padding: 2px 7px; border-radius: 5px;
    border: 1px solid var(--border); background: rgba(255,255,255,0.04);
    font-family: monospace; font-size: 10px;
  }

  /* === SVG node styling === */
  .node {
    fill: var(--bg-card);
    stroke: rgba(255,255,255,0.18);
    stroke-width: 1.4;
    transition: stroke 0.3s, fill 0.3s, opacity 0.4s, filter 0.3s;
  }
  .node.glow { filter: drop-shadow(0 0 10px rgba(48,127,226,0.6)); stroke: var(--accent-blue); }
  .node.warn { stroke: var(--accent-orange); filter: drop-shadow(0 0 8px rgba(255,185,0,0.5)); }
  .node.danger { stroke: var(--accent-red); fill: rgba(218,41,28,0.08); filter: drop-shadow(0 0 10px rgba(218,41,28,0.55)); }
  .node.good { stroke: var(--accent-cyan); filter: drop-shadow(0 0 10px rgba(60,177,126,0.55)); }
  .node-label {
    fill: var(--text-primary);
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    text-anchor: middle;
    pointer-events: none;
  }
  .node-sub {
    fill: var(--text-dim);
    font-size: 10px;
    text-anchor: middle;
    pointer-events: none;
  }
  .link {
    stroke: rgba(255,255,255,0.18);
    stroke-width: 1.2;
    fill: none;
  }
  .link.attack {
    stroke: var(--accent-red);
    stroke-width: 2.2;
    stroke-dasharray: 6 4;
    filter: drop-shadow(0 0 5px rgba(218,41,28,0.7));
    animation: dash 1.2s linear infinite;
  }
  .link.defense {
    stroke: var(--accent-cyan);
    stroke-width: 2;
  }
  @keyframes dash { to { stroke-dashoffset: -20; } }

  /* Hero / title scene */
  .hero {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    text-align: center;
  }
  .hero-inner { max-width: 760px; padding: 40px; }
  .hero h1 {
    font-size: clamp(36px, 5.5vw, 58px); font-weight: 800;
    letter-spacing: -0.03em; line-height: 1.1;
    color: var(--text-primary);
    margin: 0 0 20px;
  }
  .hero p { font-size: clamp(14px, 1.5vw, 17px); color: var(--text-secondary); line-height: 1.65; max-width: 600px; margin: 0 auto; }
  .hero .meta {
    font-size: 11px; color: var(--text-dim);
    font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; margin-bottom: 14px;
  }
  .hero .accent-rule {
    width: 56px; height: 3px; margin: 0 auto 24px;
    background: linear-gradient(90deg, var(--accent-red), var(--accent-blue), var(--accent-cyan));
    border-radius: 2px;
  }

  /* Stat citation links */
  .stat .v a {
    color: inherit; text-decoration: none;
    border-bottom: 1px dotted rgba(255,255,255,0.25);
    transition: color 0.2s, border-color 0.2s;
  }
  .stat .v a:hover { color: var(--accent-blue); border-bottom-color: var(--accent-blue); }
  .stat .src {
    display: inline-block; margin-left: 4px; font-size: 10px;
    color: var(--text-dim); text-decoration: none;
    transition: color 0.2s;
    vertical-align: super;
  }
  .stat .src:hover { color: var(--accent-blue); }

  /* The Gap scene */
  .gap-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    padding: 24px;
    height: 100%;
    overflow-y: auto;
  }
  .gap-tile {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    background: var(--bg-card);
    display: flex; flex-direction: column; gap: 8px;
    position: relative;
    overflow: hidden;
  }
  .gap-tile::after {
    content: "BLIND";
    position: absolute; top: 12px; right: 12px;
    font-size: 9px; font-weight: 800; letter-spacing: 0.18em;
    color: var(--accent-red);
    background: rgba(218,41,28,0.10);
    padding: 3px 8px; border-radius: 4px;
    border: 1px solid rgba(218,41,28,0.35);
  }
  .gap-tile h4 { margin: 0; font-size: 13px; color: var(--text-primary); font-weight: 700; }
  .gap-tile .desc { font-size: 11.5px; color: var(--text-secondary); line-height: 1.55; }
  .gap-tile .icon { font-size: 22px; }

  /* Story scene */
  .story {
    display: flex; flex-direction: column;
    gap: 12px; padding: 64px 32px 24px; height: 100%;
    overflow-y: auto;
  }
  .story-step {
    display: grid; grid-template-columns: auto 1fr auto; gap: 18px;
    padding: 14px 18px; border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    align-items: center;
    opacity: 0; transform: translateX(-8px);
    transition: opacity 0.5s, transform 0.5s;
  }
  .story-step.appear { opacity: 1; transform: translateX(0); }
  .story-step .when {
    color: var(--text-dim); font-size: 11px;
    width: 70px; font-weight: 700; letter-spacing: 0.06em;
  }
  .story-step .what { font-size: 13px; color: var(--text-primary); line-height: 1.55; }
  .story-step .what b { color: var(--accent-orange); font-weight: 700; }
  .story-step .impact {
    font-size: 10px; color: var(--text-dim);
    letter-spacing: 0.04em; font-weight: 600;
    text-align: right; text-transform: uppercase;
  }
  .story-step.critical { border-color: rgba(218,41,28,0.4); background: rgba(218,41,28,0.04); }
  .story-step.critical .what b { color: var(--accent-red); }

  /* SSPM capabilities scene */
  .sspm-layout {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    padding: 24px;
    height: 100%;
    overflow-y: auto;
  }
  .sspm-cap {
    border: 1px solid rgba(60,177,126,0.30);
    border-radius: 12px;
    padding: 18px;
    background: linear-gradient(160deg, rgba(60,177,126,0.05), var(--bg-card));
    display: flex; flex-direction: column; gap: 8px;
  }
  .sspm-cap .ico {
    width: 34px; height: 34px; border-radius: 9px;
    background: rgba(60,177,126,0.12);
    border: 1px solid rgba(60,177,126,0.35);
    display: grid; place-items: center;
    font-size: 17px; margin-bottom: 4px;
  }
  .sspm-cap h4 { margin: 0; font-size: 14px; font-weight: 700; color: var(--text-primary); }
  .sspm-cap p { margin: 0; font-size: 12px; color: var(--text-secondary); line-height: 1.55; }
  .sspm-cap .covers {
    margin-top: auto; padding-top: 10px;
    border-top: 1px dashed rgba(60,177,126,0.25);
    font-size: 10.5px; color: var(--accent-cyan);
    letter-spacing: 0.02em;
  }

  /* Story banner */
  .breach-banner {
    position: absolute; top: 18px; left: 50%;
    transform: translateX(-50%);
    padding: 7px 18px; border-radius: 999px;
    background: rgba(218,41,28,0.10);
    border: 1px solid rgba(218,41,28,0.4);
    color: var(--accent-red); font-size: 11px; font-weight: 700;
    letter-spacing: 0.15em; text-transform: uppercase;
  }

  /* === Scrollbar === */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.10); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }

  /* === Responsive === */
  @media (max-height: 800px) {
    .panel { padding: 22px clamp(20px, 4vw, 56px); }
    .body { gap: 18px; }
  }
  @media (max-width: 1024px) {
    .body { grid-template-columns: 1fr; }
    .visual { min-height: 280px; }
  }
</style>
</head>

<header class="topbar">
  <div class="topbar-brand">
    <div class="topbar-title">SSPM · The Attack Surface, Then &amp; Now</div>

<script>
/* ============================================================
   The Attack Surface, Then & Now — Interactive SSPM Demo

const SCENES = [

  {

  {

      {

  {

/* ============================================================
   SVG visual library
   ============================================================ */

function svgWrap(inner) {
  return `<svg viewBox="0 0 760 520" preserveAspectRatio="xMidYMid meet"
    style="width:100%; height:100%; display:block;">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
        markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#DA291C" />
      </marker>
      <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5"
        markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#3CB17E" />
      </marker>
      <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
        markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#3CB17E" />
      </marker>
      <radialGradient id="halo" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="rgba(60,177,126,0.15)"/>
        <stop offset="100%" stop-color="rgba(60,177,126,0)"/>
      </radialGradient>
    </defs>
    ${inner}
  </svg>`;
}

function box(x, y, w, h, label, sub, cls = "") {
  return `
    <g class="g-${cls}">
      <rect class="node ${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="10" ry="10" />
      <text class="node-label" x="${x + w / 2}" y="${y + h / 2 - (sub ? 2 : -4)}">${label}</text>
      ${sub ? `<text class="node-sub" x="${x + w / 2}" y="${y + h / 2 + 14}">${sub}</text>` : ""}
    </g>`;
}

function link(x1, y1, x2, y2, cls = "") {
  return `<line class="link ${cls}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${cls === "attack" ? 'marker-end="url(#arrow)"' : cls === "defense" ? 'marker-end="url(#arrow-good)"' : ""} />`;
}

function renderSide(side) {
  if (!side) return "";
  return side.map(s => {
    if (s.kind === "card") {
      const body = s.body
        ? `<p>${s.body}</p>`
        : s.bullets
        ? `<ul class="bullets">${s.bullets.map(b => `<li class="${b.cls}">${b.txt}</li>`).join("")}</ul>`
        : "";
      return `<div class="card"><h3>${s.title}</h3>${body}</div>`;
    }
    if (s.kind === "card-danger") {
      return `<div class="card danger"><h3>${s.title}</h3><p>${s.body}</p>${
        s.bullets ? `<ul class="bullets" style="margin-top:10px">${s.bullets.map(b => `<li class="${b.cls}">${b.txt}</li>`).join("")}</ul>` : ""
      }</div>`;
    }
    if (s.kind === "card-warn") {
      return `<div class="card warn"><h3>${s.title}</h3>${s.body ? `<p>${s.body}</p>` : ""}${
        s.bullets ? `<ul class="bullets" style="margin-top:10px">${s.bullets.map(b => `<li class="${b.cls}">${b.txt}</li>`).join("")}</ul>` : ""
      }</div>`;
    }
    if (s.kind === "card-good") {
      return `<div class="card good"><h3>${s.title}</h3>${s.body ? `<p>${s.body}</p>` : ""}${
        s.bullets ? `<ul class="bullets" style="margin-top:10px">${s.bullets.map(b => `<li class="${b.cls}">${b.txt}</li>`).join("")}</ul>` : ""
      }</div>`;
    }
    if (s.kind === "stat") {
      return `<div class="card">${s.items.map(i => {
        const val = i.src
          ? `<a href="${i.src}" target="_blank" rel="noopener" title="${escapeAttr(i.srcLabel || "Source")}">${i.v}</a>`
          : i.v;
        return `
        <div class="stat" style="margin: 6px 0;">
          <div class="v">${val}</div>
          <div class="l">${i.l}${i.src ? ` <a class="src" href="${i.src}" target="_blank" rel="noopener" title="${escapeAttr(i.srcLabel || "Source")}">↗</a>` : ""}</div>
        </div>`;
      }).join("")}</div>`;
    }
    return "";
  }).join("");
}

  }

  // Story scene: stagger reveal
  if (s.type === "story") {
    const steps = canvas.querySelectorAll(".story-step");
    steps.forEach((el, i) => {
      setTimeout(() => el.classList.add("appear"), 120 + i * 90);

function panelHead(s) {
  return `
    <div class="panel-head">
      ${s.eyebrow ? `<div class="eyebrow">${s.eyebrow}</div>` : ""}
      <h1>${s.tag ? `<span class="tag ${s.tag}">${labelFor(s.tag)}</span>` : ""}${s.title}</h1>
      ${s.subtitle ? `<div class="subtitle">${s.subtitle}</div>` : ""}
    </div>`;
}

function labelFor(tag) {
  switch (tag) {
    case "era-old": return "2015";
    case "era-new": return "Today";
    case "era-gap": return "The Gap";
    case "era-fix": return "SSPM";
    default: return "";
  }
}

/* Four acts, each mapped to a contiguous range of scenes */
const ACTS = [
  { label: "1", name: "Then",   era: "era-old", range: [0, 4] },   // hero + old-world (0..4)
  { label: "2", name: "Now",    era: "era-new", range: [5, 10] },  // shift + 5 modern attacks (5..10)
  { label: "3", name: "Gap",    era: "era-gap", range: [11, 12] }, // gap + story (11..12)
  { label: "4", name: "Answer", era: "era-fix", range: [13, 15] }  // SSPM scenes + close (13..15)
];

function actForScene(idx) {
  return ACTS.findIndex(a => idx >= a.range[0] && idx <= a.range[1]);
}

function renderTimeline(active) {
  const currentAct = actForScene(active);
  const parts = [];
  ACTS.forEach((a, i) => {
    const cls = i === currentAct ? "active" : "";
    parts.push(`
      <div class="timeline-dot ${a.era} ${cls}" data-idx="${a.range[0]}" title="${escapeAttr(a.name)}">
        ${a.label}
      </div>`);
    if (i < ACTS.length - 1) {
      const filled = i < currentAct ? "filled" : "";
      const nextEra = ACTS[i + 1].era;
      parts.push(`<div class="timeline-line ${nextEra} ${filled}"></div>`);
    }
  });
  timelineEl.innerHTML = parts.join("");
  timelineEl.querySelectorAll(".timeline-dot").forEach(el => {
    el.addEventListener("click", () => goTo(parseInt(el.dataset.idx, 10)));
  });
}

function escapeAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
}

function goTo(i) {
  if (i < 0 || i >= SCENES.length) return;
  current = i;
  renderScene(i);
}

prevBtn.addEventListener("click", () => goTo(current - 1));
nextBtn.addEventListener("click", () => goTo(current + 1));

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
    e.preventDefault();
    goTo(current + 1);
  } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
    e.preventDefault();
    goTo(current - 1);
  } else if (e.key === "Home") {
    goTo(0);
  } else if (e.key === "End") {
    goTo(SCENES.length - 1);
  }
});
